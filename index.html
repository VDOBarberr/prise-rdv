<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- EMPÊCHE LE ZOOM SUR MOBILE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    
    <!-- VERIFICATION GOOGLE & DESCRIPTION -->
    <title>VDO Barber</title>
    <meta name="description" content="Réservez votre coupe de cheveux et taille de barbe chez VDO Barber en quelques clics. Prise de rendez-vous en ligne rapide et simple." />

    <!-- SCRIPT DE BLOCAGE DU ZOOM (Safari / Chrome Mobile) -->
    <script>
      // Bloque le pincement pour zoomer (pinch-to-zoom)
      document.addEventListener('touchmove', function (event) {
        if (event.scale !== 1) {
          event.preventDefault();
        }
      }, { passive: false });

      // Bloque le double-tap pour zoomer
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, false);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
